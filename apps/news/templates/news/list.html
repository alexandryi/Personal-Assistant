{% extends "base.html" %}

{% block content %}

<h1>Gaming News</h1>

<div class="news-container">

    {% for article in news %}
        <div class="news-card">

            {% if article.urlToImage %}
                <img src="{{ article.urlToImage }}" width="300">
            {% endif %}

            <h3>{{ article.title }}</h3>

            <p>
                {{ article.description }}
            </p>

            <small>
                {{ article.source.name }}
            </small>

            <br><br>

            <a href="{{ article.url }}" target="_blank">
                Read more
            </a>

        </div>

        <hr>

    {% endfor %}

</div>

{% endblock %}
