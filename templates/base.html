<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark px-3">

    <a class="navbar-brand">
        Personal Assistant
    </a>

    <div class="d-flex gap-2">

        <a class="btn btn-outline-light" href="/contacts/">
            Contacts
        </a>

        <a class="btn btn-outline-light" href="/notes/">
            Notes
        </a>

        <a class="btn btn-outline-light" href="/files/">
            Files
        </a>

        <a class="btn btn-outline-light" href="/news/">
            News
        </a>

    </div>

    <div class="d-flex align-items-center gap-2">

        {% if user.is_authenticated %}

            <span class="text-light">
                Hi, {{ user.username }}
            </span>

            <form action="/accounts/logout/" method="post" class="d-inline">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-light">
                    Logout
                </button>
            </form>

        {% else %}

            <a class="btn btn-outline-light" href="/accounts/login/">
                Login
            </a>

            <a class="btn btn-outline-light" href="/register/">
                Register
            </a>

        {% endif %}

    </div>

</nav>

<div class="container mt-4">

{% block content %}
{% endblock %}

</div>

</body>
</html>
